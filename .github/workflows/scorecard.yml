name: OpenSSF Scorecard

# Supply-chain security posture (branch protection, pinned dependencies,
# CI/CD config, ...) — a broader check than any single tool above, since
# it looks at how the *repo itself* is configured, not just this app's
# code or dependencies. Results feed the badge in README.md and show up
# under the repo's Security -> Code scanning tab (as "Scorecard").

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # v2.6.0's own Docker image is gone from ghcr.io (its tag points at a
      # manifest that no longer exists), so every run failed at "Pull
      # ghcr.io/ossf/scorecard-action". Held at v2.5.0 until a fixed release
      # ships; see the matching ignore in dependabot.yml.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: results.sarif
